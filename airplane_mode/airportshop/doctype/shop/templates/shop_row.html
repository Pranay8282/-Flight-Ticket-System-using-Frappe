<div class="shop-details" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 30px; border-radius: 12px; box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.25); margin: 20px auto; width: 90%; max-width: 700px; color: #fff; font-family: 'Arial', sans-serif; position: relative;">
    <div class="shop-details-overlay">
        <h2 style="font-size: 30px; margin-bottom: 20px; font-weight: 700; text-align: center; color: #ffcc00;">
            <a href="/route/{{ doc.shop_name | replace(' ', '-') }}" style="color: #2d38d8; text-decoration: none;">
                {{ doc.shop_name }}
            </a>							
        </h2>

        <!-- Conditional Button: Show if status is "Available" -->
        {% if doc.status == "Available" %}
            <a href="/shop-lead/new?shop={{ doc.name }}&status=Interested" class="lead-btn" style="display: inline-block; background-color: #ffcc00; color: #ffffff; padding: 15px 25px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: 600; transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out; margin-top: 20px; text-align: center; cursor: pointer; box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);">
                I'm Interested
            </a>
        {% else %}
            <p style="font-size: 18px; color: rgba(255, 255, 255, 0.9); margin-top: 20px; text-align: center; font-weight: bold;">
                <span style="color: #ff0000;">This shop is currently occupied.</span>
            </p>
        {% endif %}
    </div>
</div>

<style>
    /* Style for the shop-details container */
    .shop-details {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.25);
        margin: 20px auto;
        width: 90%;
        max-width: 700px;
        color: #fff;
        font-family: 'Arial', sans-serif;
        position: relative;
        transition: all 0.3s ease-in-out;
    }

    .shop-details:hover {
        box-shadow: 0px 6px 30px rgba(0, 0, 0, 0.4);
        transform: translateY(-5px);
    }

    /* Overlay style */
    .shop-details-overlay {
        position: relative;
        padding: 20px;
        text-align: center;
    }

    .shop-details h2 {
        font-size: 30px;
        margin-bottom: 20px;
        font-weight: 700;
        text-align: center;
        color: #ffcc00;
    }

    .shop-details a {
        text-decoration: none;
        color: #2d38d8;
    }

    .lead-btn {
        display: inline-block;
        background-color: #ffcc00;
        color: #ffffff;
        padding: 15px 25px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
        margin-top: 20px;
        text-align: center;
        cursor: pointer;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
    }

    .lead-btn:hover {
        background-color: #ffbb00;
        transform: scale(1.05);
    }

    .shop-details p {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 20px;
        font-weight: bold;
    }

    /* Special Red Message Style */
    .shop-details p span {
        color: #ff0000;
    }
</style>
